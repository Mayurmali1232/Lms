server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/lms_auth_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Strict enterprise setting: Fallback only to a developer env variable, no hardcoded default
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:dGhpcy1pcy1hLXByb2R1Y3Rpb24tZ3JhZGUtMjU2LWJpdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW5z!}
      expiration: 86400000 # 24 hours in milliseconds

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info