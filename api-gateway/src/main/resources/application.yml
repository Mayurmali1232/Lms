server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # Automatically discovers routes from Eureka if needed
          enabled: false
          lower-case-service-id: true
      routes:
        # Route for Auth Service
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        # Route for Course Service
        - id: course-service-route
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/api/v1/courses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true